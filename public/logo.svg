<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f766e" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)" filter="url(#shadow)"/>
  
  <!-- Subtle inner glow ring -->
  <rect x="40" y="40" width="432" height="432" rx="80" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Stylized "C" letter -->
  <path d="M310 148c-12-8-30-16-54-16-72 0-120 56-120 124s48 124 120 124c24 0 42-8 54-16" 
        fill="none" stroke="white" stroke-width="44" stroke-linecap="round"/>
  
  <!-- AI accent dot / spark -->
  <circle cx="340" cy="148" r="22" fill="url(#accent)"/>
  
  <!-- Small decorative dots suggesting AI/network -->
  <circle cx="370" cy="200" r="8" fill="url(#accent)" opacity="0.6"/>
  <circle cx="384" cy="260" r="6" fill="url(#accent)" opacity="0.4"/>
  
  <!-- Subtle connecting lines -->
  <line x1="340" y1="170" x2="370" y2="200" stroke="url(#accent)" stroke-width="2" opacity="0.5"/>
  <line x1="370" y1="200" x2="384" y2="260" stroke="url(#accent)" stroke-width="1.5" opacity="0.3"/>
</svg>
